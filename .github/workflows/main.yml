name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer and jnius
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          pip install https://github.com/kivy/pyjnius/archive/master.zip

      - name: Install Android SDK command-line tools and link for Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d ~/.buildozer/android/platform/android-sdk/
          mv ~/.buildozer/android/platform/android-sdk/cmdline-tools ~/.buildozer/android/platform/android-sdk/latest
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf ~/.buildozer/android/platform/android-sdk/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/tools/bin
          yes | sdkmanager --licenses --sdk_root=~/.buildozer/android/platform/android-sdk || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" --sdk_root=~/.buildozer/android/platform/android-sdk || true

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/tools/bin
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/platform-tools
          buildozer android debug
          ls -la bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealer-apk
          path: bin/*.apk
