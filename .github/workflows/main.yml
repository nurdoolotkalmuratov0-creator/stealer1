name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer and jnius
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          pip install https://github.com/kivy/pyjnius/archive/master.zip

      - name: Use system Android SDK and create symlinks for Buildozer
        run: |
          # Используем системный Android SDK от GitHub Actions
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          mkdir -p ~/.buildozer/android/platform
          ln -sf $ANDROID_SDK_ROOT ~/.buildozer/android/platform/android-sdk
          # Создаём симлинк для sdkmanager в место, где его ищет Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          # Проверяем
          ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin
          export PATH=$PATH:/usr/local/lib/android/sdk/platform-tools
          buildozer android debug
          ls -la bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealer-apk
          path: bin/*.apk
